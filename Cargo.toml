[package]
name = "aa-media"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.28"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

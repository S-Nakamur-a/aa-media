[package]
name = "aa-media"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "aa_media"
path = "src/lib.rs"

[[bin]]
name = "aa-media"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
